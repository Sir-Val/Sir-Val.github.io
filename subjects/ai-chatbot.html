<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chatbot</title>
    <style>
        :root { --bg: #f0f2f5; --primary: #0084ff; --text: #333; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background: #fff; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); font-weight: bold; }

        /* Chat Window */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 15px; font-size: 15px; line-height: 1.5; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: white; color: var(--text); border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Input Area */
        .input-container { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; border: 1px solid #ddd; padding: 12px; border-radius: 25px; outline: none; }
        button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

<header>Gemini AI Assistant</header>

<div id="chat-window">
    <div class="msg ai">Hello! I'm an AI hosted on GitHub Pages. How can I help you?</div>
</div>

<form class="input-container" id="chat-form">
    <input type="text" id="user-input" placeholder="Ask me anything..." autocomplete="off">
    <button type="submit" id="send-btn">Send</button>
</form>

<script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const windowDiv = document.getElementById('chat-window');
    const btn = document.getElementById('send-btn');

    // REPLACE THIS with your actual Vercel URL
    const VERCEL_URL = 'https://gemini-proxy-eta-virid.vercel.app/';

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = '';
        btn.disabled = true;

        const loadingMsg = addMessage('...', 'ai');

        try {
            const response = await fetch(VERCEL_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });
            const data = await response.json();
            loadingMsg.innerText = data.reply;
        } catch (err) {
            loadingMsg.innerText = "Error: Could not connect to the AI.";
        } finally {
            btn.disabled = false;
        }
    });

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        windowDiv.appendChild(div);
        windowDiv.scrollTop = windowDiv.scrollHeight;
        return div;
    }
</script>

</body>
</html>
