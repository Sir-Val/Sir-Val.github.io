<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riri - AI Professor Assistant</title>
    <style>
        :root { --bg: #f0f2f5; --primary: #0084ff; --text: #333; --ai-bg: #ffffff; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        header { background: #fff; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-bottom: 2px solid var(--primary); }
        header h1 { margin: 0; font-size: 1.2rem; color: var(--text); }
        header p { margin: 5px 0 0; font-size: 0.8rem; color: #666; }

        /* Chat Window */
        #chat-window { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; word-wrap: break-word; position: relative; }
        .user { align-self: flex-end; background: var(--primary); color: white; border-bottom-right-radius: 2px; }
        .ai { align-self: flex-start; background: var(--ai-bg); color: var(--text); border-bottom-left-radius: 2px; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }

        /* Thinking/Typing Animation */
        .typing { display: flex; align-items: center; gap: 4px; height: 20px; }
        .dot { width: 6px; height: 6px; background: #ccc; border-radius: 50%; animation: pulse 1.5s infinite ease-in-out; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.4; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* Input Area */
        .input-container { padding: 15px; background: white; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input { flex: 1; border: 1px solid #ddd; padding: 12px 18px; border-radius: 25px; outline: none; font-size: 15px; }
        input:focus { border-color: var(--primary); }
        button { background: var(--primary); color: white; border: none; padding: 0 20px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

<header>
    <h1>Riri</h1>
    <p>Assistant to Engr. Val Patrick Fabregas</p>
</header>

<div id="chat-window">
    <div class="msg ai">Hello! I am Riri, the AI assistant for Engr. Fabregas's Artificial Intelligence class. How may I assist you today?</div>
</div>

<form class="input-container" id="chat-form">
    <input type="text" id="user-input" placeholder="Ask about AI concepts..." autocomplete="off">
    <button type="submit" id="send-btn">Send</button>
</form>

<script>
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');
    const windowDiv = document.getElementById('chat-window');
    const btn = document.getElementById('send-btn');

    // REPLACE THIS with your actual Vercel URL
    const VERCEL_URL = 'https://gemini-proxy-eta-virid.vercel.app/api/chat';

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        // 1. Add User Message
        addMessage(text, 'user');
        input.value = '';
        btn.disabled = true;

        // 2. Add "Thinking" Loading Message
        const loadingMsg = addLoadingMessage();

        try {
            const response = await fetch(VERCEL_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });
            const data = await response.json();
            
            // 3. Replace loading animation with actual text
            loadingMsg.innerHTML = data.reply;
        } catch (err) {
            loadingMsg.innerText = "I am sorry, I encountered a connection error. Please try again.";
        } finally {
            btn.disabled = false;
            windowDiv.scrollTop = windowDiv.scrollHeight;
        }
    });

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = `msg ${sender}`;
        div.innerText = text;
        windowDiv.appendChild(div);
        windowDiv.scrollTop = windowDiv.scrollHeight;
        return div;
    }

    function addLoadingMessage() {
        const div = document.createElement('div');
        div.className = `msg ai`;
        // Insert the 3-dot animation HTML
        div.innerHTML = `
            <div class="typing">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        `;
        windowDiv.appendChild(div);
        windowDiv.scrollTop = windowDiv.scrollHeight;
        return div;
    }
</script>

</body>
</html>
